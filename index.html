<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kocham Cię, Dominika ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4f81, #ff1744, #8e24aa);
    color: white;
}

.container {
    width: 90%;
    max-width: 430px;
    padding: 40px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

.heart {
    font-size: 75px;
    animation: heartbeat 1s infinite;
}

h1 {
    font-size: 36px;
    margin: 15px 0 25px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

.percent {
    font-size: 65px;
    font-weight: bold;
    margin-bottom: 15px;
}

.progress {
    width: 100%;
    height: 20px;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: white;
    border-radius: 20px;
    transition: width 0.08s linear;
}

.message {
    margin-top: 25px;
    font-size: 25px;
    font-weight: bold;
    opacity: 0;
    transform: scale(0.5);
    transition: all 1s ease;
}

.message.show {
    opacity: 1;
    transform: scale(1);
}

button {
    margin-top: 25px;
    padding: 14px 22px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #e91e63;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

.floating-heart {
    position: fixed;
    top: -40px;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

@keyframes fall {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Kocham Cię, Dominika</h1>

    <div class="percent" id="percent">
        0%
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="message" id="message">
        Kocham Cię najbardziej na świecie ❤️
    </div>

    <button onclick="openMusic()">
        🎵 Noc – White 2115
    </button>

</div>

<script>

let percentage = 0;

const percent = document.getElementById("percent");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");

const counter = setInterval(() => {

    percentage++;

    percent.textContent = percentage + "%";
    progressBar.style.width = percentage + "%";

    if (percentage >= 100) {

        clearInterval(counter);

        message.classList.add("show");

        for (let i = 0; i < 30; i++) {
            createHeart();
        }
    }

}, 45);


function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const hearts = ["❤️", "💕", "💗", "💖", "💘"];

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}


setInterval(createHeart, 400);


function openMusic() {

    window.open(
        "https://www.youtube.com/results?search_query=White+2115+Noc",
        "_blank"
    );

}

</script>

</body>
</html>
